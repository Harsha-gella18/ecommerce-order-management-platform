server:
  port: ${SERVER_PORT:8080}

# Localhost microservices (no ${GATEWAY_*:...} placeholders in routes — avoids empty env / SCG resolution bugs).
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: auth-service
          uri: "http://127.0.0.1:8081"
          predicates:
            - Path=/api/auth/**
        - id: user-service
          uri: "http://127.0.0.1:8082"
          predicates:
            - Path=/api/users/**
          filters:
            - StripPrefix=1
        - id: product-service
          uri: "http://127.0.0.1:8083"
          predicates:
            - Path=/api/products/**
          filters:
            - StripPrefix=1
        - id: inventory-service
          uri: "http://127.0.0.1:8084"
          predicates:
            - Path=/api/inventory/**
          filters:
            - StripPrefix=1
        - id: cart-service
          uri: "http://127.0.0.1:3001"
          predicates:
            - Path=/api/cart/**
          filters:
            - StripPrefix=1
        - id: order-service
          uri: "http://127.0.0.1:8085"
          predicates:
            - Path=/api/orders/**
          filters:
            - StripPrefix=1
        - id: payment-service
          uri: "http://127.0.0.1:8086"
          predicates:
            - Path=/api/payments/**
          filters:
            - StripPrefix=1
        - id: notification-service
          uri: "http://127.0.0.1:3002"
          predicates:
            - Path=/api/notifications/**
          filters:
            - StripPrefix=1
        - id: analytics-service
          uri: "http://127.0.0.1:8000"
          predicates:
            - Path=/api/analytics/**
          filters:
            - StripPrefix=1

jwt:
  secret: ${JWT_SECRET:ecommerce-jwt-secret-key-for-development-min-256-bits-long-for-hs256-algorithm-safety}
