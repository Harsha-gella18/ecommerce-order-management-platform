server:
  port: ${SERVER_PORT:8086}

# Capstone / local dev: mock payments only (no PSP). RabbitMQ is optional — exclude AMQP autoconfig
# so `mvn spring-boot:run` works without a broker (and works in PowerShell without extra -D flags).
spring:
  application:
    name: payment-service
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
  data:
    mongodb:
      uri: ${PAYMENT_MONGODB_URI:${SPRING_DATA_MONGODB_URI:mongodb://127.0.0.1:27017/payment_db}}
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: guest
    password: guest

jwt:
  secret: ${JWT_SECRET:ecommerce-jwt-secret-key-for-development-min-256-bits-long-for-hs256-algorithm-safety}

springdoc:
  api-docs:
    path: /v3/api-docs
