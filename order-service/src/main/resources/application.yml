server:
  port: ${SERVER_PORT:8085}

# Local dev default: no RabbitMQ required (same as former `local` profile). Avoids
# `mvn -Dspring-boot.run.profiles=local` — PowerShell breaks unquoted -D arguments.
spring:
  application:
    name: order-service
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
  data:
    mongodb:
      uri: ${ORDER_MONGODB_URI:${SPRING_DATA_MONGODB_URI:mongodb://127.0.0.1:27017/order_db}}
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: guest
    password: guest

jwt:
  secret: ${JWT_SECRET:ecommerce-jwt-secret-key-for-development-min-256-bits-long-for-hs256-algorithm-safety}

app:
  # 127.0.0.1 avoids Windows resolving localhost → ::1 while services listen on IPv4 only
  cart-service-url: ${CART_SERVICE_URL:http://127.0.0.1:3001}
  inventory-service-url: ${INVENTORY_SERVICE_URL:http://127.0.0.1:8084}
  payment-service-url: ${PAYMENT_SERVICE_URL:http://127.0.0.1:8086}
  user-service-url: ${USER_SERVICE_URL:http://127.0.0.1:8082}
